apiVersion: apps/v1
kind: Deployment
metadata:
  name: woodpecker-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woodpecker-server
  template:
    metadata:
      labels:
        app: woodpecker-server
    spec:
      containers:
        - name: server
          image: woodpeckerci/woodpecker-server:v3.18.1
          envFrom:
            - secretRef:
                name: woodpecker
          env:
            # TODO: change this for prod woodpecker
            - name: WOODPECKER_HOST
            # TODO: update to prod url
              value: https://it220215.cloud.htl-leonding.ac.at
            - name: WOODPECKER_FORGEJO
              value: "true"
            - name: WOODPECKER_FORGEJO_URL
            # TODO: update to prod url
              value: https://it220266.cloud.htl-leonding.ac.at
            - name: WOODPECKER_ADMIN
              value: fistel
            - name: WOODPECKER_DATABASE_DRIVER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: woodpecker-db, key: POSTGRES_PASSWORD}
            - name: WOODPECKER_DATABASE_DATASOURCE
              value: postgres://woodpecker:$(PGPASSWORD)@woodpecker-postgres:5432/woodpecker?sslmode=disable
          ports:
            - containerPort: 8000
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: woodpecker-server
spec:
  selector:
    app: woodpecker-server
  ports:
    - name: web
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: woodpecker-agent-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: woodpecker-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: woodpecker-agent
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services", "secrets"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["watch", "create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: woodpecker-agent
subjects:
  - kind: ServiceAccount
    name: woodpecker-agent
roleRef:
  kind: Role
  name: woodpecker-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woodpecker-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woodpecker-agent
  template:
    metadata:
      labels:
        app: woodpecker-agent
    spec:
      serviceAccountName: woodpecker-agent
      containers:
        - name: agent
          image: woodpeckerci/woodpecker-agent:v3.18.1
          env:
            - name: WOODPECKER_SERVER
              value: woodpecker-server:9000
            - name: WOODPECKER_AGENT_SECRET
              valueFrom:
                secretKeyRef: {name: woodpecker, key: WOODPECKER_AGENT_SECRET}
            - name: WOODPECKER_BACKEND
              value: kubernetes
            - name: WOODPECKER_BACKEND_K8S_NAMESPACE
              value: student-it220215
            - name: WOODPECKER_BACKEND_K8S_STORAGE_CLASS
              value: default
          volumeMounts:
            - name: config
              mountPath: /etc/woodpecker
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: woodpecker-agent-pvc
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: woodpecker
spec:
  ingressClassName: nginx
  rules:
    # TODO: change this for prod woodpecker
    - host: it220215.cloud.htl-leonding.ac.at
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: woodpecker-server
                port:
                  number: 8000
