apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-postgres-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # TODO: increase this
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-postgres
  template:
    metadata:
      labels:
        app: forgejo-postgres
    spec:
      containers:
        - name: forgejo-postgres
          image: postgres:18.6-alpine
          envFrom:
            - secretRef:
                name: forgejo-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-postgres
spec:
  selector:
    app: forgejo-postgres
  ports:
    - port: 5432
      targetPort: 5432
